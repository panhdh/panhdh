<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make Rent</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b26;color:#f5efdf;font-family:system-ui,sans-serif;line-height:1.6}main{max-width:660px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center}.tag{color:#ffcd78;font-size:12px;letter-spacing:3px}h1{font-size:38px;margin:6px 0}p{color:#b5c2cc}.panel{background:#1c2b38;border:1px solid #344653;border-radius:18px;padding:20px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:#14212c;padding:12px;border-radius:12px;font-size:13px}.stats strong{display:block;font-size:23px;color:#ffcd78}progress{width:100%;accent-color:#eeb96e;height:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;text-align:left;background:#243b49;border:1px solid #48616e;color:#fff;border-radius:13px;padding:16px;cursor:pointer;min-height:84px}button:hover{background:#345465}button:focus-visible{outline:3px solid #ffcd78}button small{display:block;color:#c1ced3}button:disabled{opacity:.4;cursor:not-allowed}.restart{min-height:0;padding:8px 14px;font-size:13px}.note{font-size:13px}#log{padding-left:22px;color:#c7d2d9;font-size:14px}#result{border-color:#ffcd78}footer{font-size:12px;color:#879ca9;text-align:center;margin-top:26px}@media(max-width:380px){main{padding:20px 12px}.stats strong{font-size:19px}button{padding:12px}h1{font-size:32px}}

header{flex-wrap:wrap;gap:10px}.tools{display:flex;gap:8px;align-items:center}select{background:#243b49;color:white;padding:8px;border:1px solid #48616e;border-radius:8px;font:inherit;max-width:125px}summary{cursor:pointer;font-weight:bold}h1{line-height:1.2}.goal{color:#ffcd78;font-weight:bold}label{font-size:13px}
</style><main><header><span class="tag" data-t="tag"></span><div class="tools"><label for="language" data-t="language"></label><select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select><button class="restart" id="reset" data-t="reset"></button></div></header><h1 data-t="title"></h1><p data-t="intro"></p><details class="panel" open><summary data-t="how"></summary><p data-t="instructions"></p><p class="note" data-t="strategy"></p></details><section class="panel"><div id="day"></div><progress id="progress" max="20"></progress><div class="stats"><div><span data-t="cash"></span><strong id="money"></strong></div><div><span data-t="energy"></span><strong id="energy"></strong></div><div><span data-t="skill"></span><strong id="skill"></strong></div></div><p class="goal" id="goal"></p><p class="note" data-t="costs"></p><p class="note" id="warning" role="status"></p></section><section id="result" class="panel" hidden aria-live="polite"></section><div class="actions"><button data-action="work"><span data-t="work"></span><small data-t="workcost"></small></button><button data-action="gig"><span data-t="gig"></span><small id="giglabel"></small></button><button data-action="learn"><span data-t="learn"></span><small data-t="learncost"></small></button><button data-action="rest"><span data-t="rest"></span><small data-t="restcost"></small></button></div><section class="panel"><strong data-t="journal"></strong><ol id="log" aria-live="polite"></ol></section><footer data-t="footer"></footer></main><script>
const TEXT={
en:{tag:'A SMALL LIFE SIMULATOR',language:'Language',title:'Make Rent',reset:'New game',intro:'Twenty days. One rent payment. How will you spend your time?',how:'How to play',instructions:'Choose ONE action each day. Finish day 20 with at least $6,000 to pay rent. Work earns cash now; studying makes future freelance jobs pay more. Rest to recover energy.',strategy:'Try working on your first day. Study early if you want higher freelance income later. You can always start over and try another plan.',cash:'Savings',energy:'Energy',skill:'Skill',costs:'Every action uses one day and costs $120 for living expenses. Every fifth day also costs $200 for supplies. Studying requires $300 (course + daily expenses). Amounts are fictional game units.',work:'☕ Café shift',workcost:'Earn $650 · −22 energy',gig:'💻 Freelance job',learn:'📚 Study',learncost:'Pay $180 · −12 energy · +1 skill',rest:'🌿 Rest',restcost:'Recover 38 energy',journal:'Life journal',footer:'About 3 minutes per game · No ads or purchases · Progress saved in this browser',confirm:'Erase this run and start a new game?',day:n=>`Day ${n} of 20`,over:'You made it to the end of the month.',goal:n=>n>=6000?'Rent covered! Keep building your savings.':`Rent goal: $6,000 · Still need $${(6000-n).toLocaleString('en-US')}`,gigcost:n=>`Earn $${n} · −30 energy`,warning:'No energy left: your next action will become a forced recovery day (+45 energy).',poor:'You need $300 to study and cover today’s expenses.',win:n=>`🎉 Rent paid! You have $${n.toLocaleString('en-US')} left after rent. Try another plan to see if you can save more.`,lose:n=>`🌧️ You are $${n.toLocaleString('en-US')} short of rent. Try studying earlier to increase freelance pay, and rest before your energy runs out.`,opening:'You moved into a small apartment. A new month begins.',legacy:'Previous-version journal entries are unavailable in this language. Your progress has been kept.',entry:(d,t)=>`Day ${d}: ${t} (Living expenses: $120.)`,supply:' Supplies cost another $200.',events:{work:'You worked a café shift and earned $650.',gig:n=>`You finished a freelance job and earned $${n}.`,learn:'You spent $180 studying. Future freelance jobs pay $170 more.',rest:'You took the day off and recovered 38 energy.',forced:'Exhausted! You had to rest. Energy recovered to 45.'}},
'zh-Hant':{tag:'小小人生模擬器',language:'語言',title:'月底生存記',reset:'重新開始',intro:'20 天，一筆房租。你會怎麼安排每一天？',how:'怎麼玩？',instructions:'每天選一個行動。第 20 天結束時存款達到 $6,000，就能付房租。打工立刻賺錢；進修能提高之後的接案收入；休息恢復體力。',strategy:'第一天可以先試試打工。想靠接案賺更多，就提早進修。隨時能重新開始，挑戰另一種安排。',cash:'存款',energy:'體力',skill:'技能',costs:'每個行動花一天，並扣 $120 生活費；每逢第 5 天再扣 $200 日用品費。進修需有 $300（課程費＋當天生活費）。金額均為虛構遊戲單位。',work:'☕ 咖啡店打工',workcost:'賺 $650 · 體力 −22',gig:'💻 接一份小案子',learn:'📚 練習新技能',learncost:'花 $180 · 體力 −12 · 技能 +1',rest:'🌿 好好休息',restcost:'恢復 38 體力',journal:'生活手帳',footer:'一局約 3 分鐘 · 不含廣告與付費 · 進度儲存在此瀏覽器',confirm:'要清除這一局，重新開始嗎？',day:n=>`第 ${n} 天 / 共 20 天`,over:'這個月，辛苦了。',goal:n=>n>=6000?'房租已達標！繼續累積存款吧。':`房租目標 $6,000 · 還差 $${(6000-n).toLocaleString('en-US')}`,gigcost:n=>`賺 $${n} · 體力 −30`,warning:'體力耗盡：下次行動將變成強制休息，體力恢復至 45。',poor:'需要 $300 才能支付進修及今天的生活費。',win:n=>`🎉 房租有著落了！支付後剩下 $${n.toLocaleString('en-US')}。試試另一種安排，看能否存得更多。`,lose:n=>`🌧️ 還差 $${n.toLocaleString('en-US')} 才能付房租。試試提早進修，提高接案收入，並在體力耗盡前休息。`,opening:'搬進小套房，開始這個月的生活。',legacy:'舊版手帳未保留於雙語版，但遊戲進度已保留。',entry:(d,t)=>`第 ${d} 天：${t}（生活費 $120）`,supply:' 另外支付 $200 日用品費。',events:{work:'在咖啡店忙了一天，領到 $650。',gig:n=>`完成小案子，收到 $${n}。`,learn:'花 $180 進修，下次接案報酬增加 $170。',rest:'好好休息，恢復 38 體力。',forced:'累倒了，被迫休息一天。體力恢復到 45。'}}};
const KEY='month-survival-v1',LANG='month-survival-language';const $=id=>document.getElementById(id);let lang='en',s;
try{const saved=localStorage.getItem(LANG);lang=saved&&TEXT[saved]?saved:(navigator.language.toLowerCase().startsWith('zh')?'zh-Hant':'en')}catch{}
function fresh(){return {day:1,money:1600,energy:80,skill:0,logs:[{type:'opening'}],ended:false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Number.isInteger(x.day)&&x.day>=1&&x.day<=21&&Number.isFinite(x.money)&&Number.isFinite(x.energy)&&x.energy>=0&&x.energy<=100&&Number.isInteger(x.skill)&&x.skill>=0&&Array.isArray(x.logs)&&typeof x.ended==='boolean'&&x.ended===(x.day===21)){if(x.logs.some(l=>typeof l==='string'))x.logs=[{type:x.day===1?'opening':'legacy'}];return x}}catch{}return fresh()}
function logText(l,t){if(l.type==='opening'||l.type==='legacy')return t[l.type];let e=t.events[l.type];return e?t.entry(l.day,(typeof e==='function'?e(l.pay):e)+(l.supplies?t.supply:'')):t.legacy}
function render(){let t=TEXT[lang];document.documentElement.lang=lang;document.title=t.title;$('language').value=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);$('day').textContent=s.ended?t.over:t.day(s.day);$('progress').value=Math.min(s.day-1,20);$('progress').setAttribute('aria-label',t.how);$('money').textContent='$'+s.money.toLocaleString('en-US');$('energy').textContent=s.energy+'/100';$('skill').textContent='Lv.'+s.skill;$('goal').textContent=t.goal(s.money);$('giglabel').textContent=t.gigcost(400+s.skill*170);$('warning').textContent=s.ended?'':s.energy===0?t.warning:s.money<300?t.poor:'';$('log').replaceChildren(...s.logs.slice(0,6).map(l=>{let li=document.createElement('li');li.textContent=logText(l,t);return li}));document.querySelectorAll('[data-action]').forEach(b=>b.disabled=s.ended||(b.dataset.action==='learn'&&s.money<300&&s.energy>0));$('result').hidden=!s.ended;if(s.ended)$('result').textContent=s.money>=6000?t.win(s.money-6000):t.lose(6000-s.money)}
function act(a){if(s.ended||!['work','gig','learn','rest'].includes(a)||(a==='learn'&&s.money<300&&s.energy>0))return;let entry={day:s.day,type:a,supplies:s.day%5===0};if(s.energy===0){s.energy=45;entry.type='forced'}else if(a==='work'){s.money+=650;s.energy-=22}else if(a==='gig'){entry.pay=400+s.skill*170;s.money+=entry.pay;s.energy-=30}else if(a==='learn'){s.money-=180;s.skill++;s.energy-=12}else{s.energy+=38}s.money-=120;if(entry.supplies)s.money-=200;s.energy=Math.max(0,Math.min(100,s.energy));s.logs.unshift(entry);s.day++;s.ended=s.day>20;save();render()}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));$('reset').onclick=()=>{if(s.day===1||confirm(TEXT[lang].confirm)){s=fresh();save();render()}};$('language').onchange=e=>{lang=e.target.value;try{localStorage.setItem(LANG,lang)}catch{}render()};s=load();render();
</script></html>
