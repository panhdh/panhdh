<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月底生存記</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b26;color:#f5efdf;font-family:system-ui,sans-serif;line-height:1.6}main{max-width:660px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center}.tag{color:#ffcd78;font-size:12px;letter-spacing:3px}h1{font-size:38px;margin:6px 0}p{color:#b5c2cc}.panel{background:#1c2b38;border:1px solid #344653;border-radius:18px;padding:20px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:#14212c;padding:12px;border-radius:12px;font-size:13px}.stats strong{display:block;font-size:23px;color:#ffcd78}progress{width:100%;accent-color:#eeb96e;height:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;text-align:left;background:#243b49;border:1px solid #48616e;color:#fff;border-radius:13px;padding:16px;cursor:pointer;min-height:84px}button:hover{background:#345465}button:focus-visible{outline:3px solid #ffcd78}button small{display:block;color:#c1ced3}button:disabled{opacity:.4;cursor:not-allowed}.restart{min-height:0;padding:8px 14px;font-size:13px}.note{font-size:13px}#log{padding-left:22px;color:#c7d2d9;font-size:14px}#result{border-color:#ffcd78}footer{font-size:12px;color:#879ca9;text-align:center;margin-top:26px}@media(max-width:380px){main{padding:20px 12px}.stats strong{font-size:19px}button{padding:12px}h1{font-size:32px}}
</style><main><header><span class="tag">A SMALL LIFE SIMULATOR</span><button class="restart" id="reset">重新開始</button></header><h1>月底生存記</h1><p>房租不會等人，但你也需要休息。<br>用 20 天，找到自己的生存節奏。</p><section class="panel"><div id="day"></div><progress id="progress" max="20"></progress><div class="stats"><div>存款<strong id="money"></strong></div><div>體力<strong id="energy"></strong></div><div>技能<strong id="skill"></strong></div></div><p class="note">目標：月底支付 $6,000 房租。每天生活費 $120；體力歸零就會被迫休息。</p></section><section id="result" class="panel" hidden aria-live="polite"></section><div class="actions" id="actions"><button data-action="work">☕ 咖啡店打工<small>賺 $650 · 體力 −22</small></button><button data-action="gig">💻 接一份小案子<small id="giglabel"></small></button><button data-action="learn">📚 練習新技能<small>花 $180 · 體力 −12 · 技能 +1</small></button><button data-action="rest">🌿 好好休息<small>恢復 38 體力</small></button></div><section class="panel"><strong>生活手帳</strong><ol id="log" aria-live="polite"></ol></section><footer>一局約 3 分鐘 · 不含廣告與付費 · 金額為遊戲設定<br>進度僅保留於此瀏覽器</footer></main><script>
const KEY='month-survival-v1';let s;const $=id=>document.getElementById(id);function fresh(){return {day:1,money:1600,energy:80,skill:0,logs:['搬進小套房，開始這個月的生活。'],ended:false}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Number.isInteger(x.day)&&x.day>=1&&x.day<=21&&Number.isFinite(x.money)&&Number.isFinite(x.energy)&&Number.isInteger(x.skill)&&x.skill>=0&&Array.isArray(x.logs)&&typeof x.ended==='boolean')return x}catch{}return fresh()}function render(){$('day').textContent=s.ended?'這個月，辛苦了。':`第 ${s.day} 天 / 共 20 天`;$('progress').value=Math.min(s.day-1,20);$('money').textContent='$'+s.money.toLocaleString();$('energy').textContent=s.energy+'/100';$('skill').textContent='Lv.'+s.skill;$('giglabel').textContent=`賺 $${400+s.skill*170} · 體力 −30`;$('log').replaceChildren(...s.logs.slice(0,6).map(t=>{let li=document.createElement('li');li.textContent=t;return li}));document.querySelectorAll('[data-action]').forEach(b=>b.disabled=s.ended||(b.dataset.action==='learn'&&s.money<300));$('result').hidden=!s.ended;if(s.ended){let ok=s.money>=6000;$('result').textContent=ok?`🎉 房租有著落了！支付後剩下 $${(s.money-6000).toLocaleString()}。${s.skill>=4?'你還培養了接案的實力。':'下個月，試著為自己多留一點餘裕。'}`:`🌧️ 還差 $${(6000-s.money).toLocaleString()} 才能付房租。試試提早進修，提升接案收入，也別讓體力耗盡。`;}}function act(a){if(s.ended||!['work','gig','learn','rest'].includes(a)||(a==='learn'&&s.money<300))return;let msg='';if(s.energy===0){s.energy=45;msg='累倒了，被迫休息一天。體力恢復到 45。'}else if(a==='work'){s.money+=650;s.energy-=22;msg='在咖啡香裡忙了一天，領到 $650。'}else if(a==='gig'){let pay=400+s.skill*170;s.money+=pay;s.energy-=30;msg=`完成小案子，收到 $${pay}。技能讓報酬慢慢增加。`;}else if(a==='learn'){s.money-=180;s.skill++;s.energy-=12;msg='花 $180 練習新技能，下次接案更有底氣。';}else{s.energy+=38;msg='散步、睡午覺，把時間留給自己。'}s.money-=120;s.energy=Math.max(0,Math.min(100,s.energy));if(s.day%5===0){s.money-=200;msg+=' 另外支付 $200 日用品費用。'}s.logs.unshift(`第 ${s.day} 天：${msg}（生活費 $120）`);s.day++;s.ended=s.day>20;save();render()}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));$('reset').onclick=()=>{if(s.day===1||confirm('要清除這一局，重新開始嗎？')){s=fresh();save();render()}};s=load();render();
</script></html>
